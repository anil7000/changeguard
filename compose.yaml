services:
  changeguard:
    build: .
    init: true
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
