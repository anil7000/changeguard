name: Cross-platform product validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/*.test.mjs demo/*.test.mjs
      - run: node demo/evaluate.mjs
      - run: node tools/check-docs.mjs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/init.mjs
      - run: sudo chown -R 1000:1000 data
      - run: docker compose -f compose.yaml -f compose.ci.yaml up --build -d
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4310/readyz; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: End-to-end container workflow
        run: sudo env PATH="$PATH" node tools/smoke.mjs
      - name: Agentic protocol workflow (test double, not real-model quality)
        run: sudo env PATH="$PATH" node tools/assess.mjs
      - name: Container test suite
        run: docker compose exec -T changeguard node --test 'test/*.test.mjs' 'demo/*.test.mjs'
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down
