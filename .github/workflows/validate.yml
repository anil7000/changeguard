name: Validate documentation and offline demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test demo/evaluate.test.mjs
      - run: node demo/evaluate.mjs
      - run: node tools/check-docs.mjs
